<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>수시 모니터링 — 수집 시작</title>
<style>
  body { margin: 0; background: #F8FAFC; color: #1F2937; font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
  .ic { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.15em; flex-shrink: 0; }
  .container { max-width: 800px; margin: 0 auto; padding: 84px 24px 80px; }
  .card { background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; padding: 22px 24px; margin-bottom: 14px; }
  /* [수정: 2026-08-19] 상단바 — 정기 화면(app/renderer.py .topbar)과 완전히 같은 모양·
     같은 여백으로 맞췄다. 예전엔 "← 수시 보관함" 링크 하나뿐이라 수시에 들어오면
     홈으로 돌아갈 길이 화면에 아예 없었다(사용자 지적). 정기가 fixed 상단바라
     .container도 같은 padding-top(60px + 원래 여백 24px)을 갖는다. */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    background: #FFFFFF; border-bottom: 1px solid #E5E7EB; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }
  .topbar-inner {
    max-width: 800px; margin: 0 auto; padding: 12px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .topbar a { color: #2563EB; text-decoration: none; font-size: 0.92rem; font-weight: 600; padding: 6px 10px; border-radius: 6px; }
  .topbar a:hover { background: #EFF6FF; }
  h1.page-title { color: #1E3A5F; font-size: 1.2rem; margin: 0 0 4px; }
  .page-sub { color: #6B7280; font-size: 0.82rem; margin: 0 0 16px; }
  /* [추가: 2026-08-18] 수시 보관함(archive_renderer)의 엑셀 내보내기 헤더 — history.html
     의 .hist-head/.hist-excel-btn과 같은 모양(둘 다 "지금 펼친 것"을 그대로 내보낸다). */
  .arch-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .arch-excel-btn {
    background: #2563EB; color: #FFFFFF; border: none; border-radius: 6px; padding: 7px 14px;
    font-size: 0.85rem; font-family: inherit; cursor: pointer; flex-shrink: 0;
  }
  .arch-excel-btn:hover { filter: brightness(1.08); }
  /* [추가: 2026-08-20] 수시 보관함 — 사안명·기간 조회 + 사안 ▸ 날짜 ▸ 회차 3단.
     세그먼트 버튼(1일/7일/1개월/전체)은 GET 폼의 submit 버튼이다(서버가 오늘 날짜
     기준으로 실제 start/end를 계산 — JS로 "오늘"을 흉내내지 않는다). */
  .period-bar { border: 1px solid #E5E7EB; border-radius: 10px; padding: 10px 12px; background: #F8FAFC; margin: 14px 0; }
  .period-bar form { margin: 0; }
  .prow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .prow + .prow, .period-bar form + form { margin-top: 9px; padding-top: 9px; border-top: 1px solid #E5E7EB; }
  .prow .jlab { color: #6B7280; font-size: 0.8rem; font-weight: 600; width: 44px; flex: none; }
  .prow input[type=search] { font: inherit; font-size: 0.86rem; border: 1px solid #E5E7EB; border-radius: 7px;
    background: #FFFFFF; color: #1F2937; padding: 6px 10px; flex: 1; min-width: 160px; }
  .prow input[type=search]:focus { outline: none; border-color: #2563EB; box-shadow: 0 0 0 2px #EFF6FF; }
  .prow input[type=date] { font: inherit; font-size: 0.85rem; border: 1px solid #E5E7EB; border-radius: 6px;
    background: #FFFFFF; color: #1F2937; padding: 5px 8px; font-variant-numeric: tabular-nums; }
  .prow .tilde { color: #6B7280; margin: 0 2px; font-weight: 600; }
  .prow .clr { border: 1px solid #E5E7EB; background: #FFFFFF; color: #6B7280; border-radius: 6px;
    padding: 5px 12px; font-size: 0.8rem; cursor: pointer; font-family: inherit; text-decoration: none; }
  .prow .clr:hover { background: #EFF6FF; color: #2563EB; }
  .prow .go { border: 1px solid #2563EB; background: #2563EB; color: #FFFFFF; border-radius: 6px;
    padding: 6px 14px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; }
  .prow .go:hover { filter: brightness(1.08); }
  .jhint { font-size: 0.78rem; color: #6B7280; }
  .seg { display: inline-flex; border: 1px solid #E5E7EB; border-radius: 8px; overflow: hidden; background: #FFFFFF; }
  .seg-btn { border: none; background: #FFFFFF; color: #6B7280; font: inherit; font-size: 0.82rem;
    padding: 6px 15px; cursor: pointer; border-right: 1px solid #E5E7EB; }
  .seg-btn:last-child { border-right: none; }
  .seg-btn.on { background: #2563EB; color: #FFFFFF; font-weight: 600; }
  .badge-custom { font-size: 0.75rem; background: #EFF6FF; color: #2563EB; border: 1px solid #BFDBFE;
    border-radius: 12px; padding: 3px 11px; font-weight: 600; }
  .result-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 14px 2px 8px; }
  .result-line { font-size: 0.82rem; color: #6B7280; display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap; flex: 1; min-width: 0; margin: 0; }
  .result-line b { color: #1E3A5F; }
  .fixhint { margin: 0 2px 10px; font-size: 0.8rem; color: #6B7280; }
  .fixhint a { color: #2563EB; }
  .qmark { background: #EFF6FF; border-radius: 3px; padding: 0 2px; }
  /* 복사/txt/엑셀 — 결과 전체·사안·날짜 세 층 모두 같은 모양. 렌더링 시점에 이미
     계산된 텍스트/rows를 hidden input에 심어 기존 공용 /download-text·/download-excel로
     보낸다(app.history_renderer의 회차별 복사·다운로드 버튼과 같은 패턴). */
  .exp { display: inline-flex; gap: 4px; flex: none; margin-left: auto; }
  .exp button { border: 1px solid #E5E7EB; background: #FFFFFF; color: #6B7280; border-radius: 6px;
    padding: 4px 11px; font-size: 0.75rem; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .exp button:hover { background: #EFF6FF; color: #2563EB; border-color: #BFDBFE; }
  .exp button.xls:hover { background: #EFF6FF; color: #2563EB; border-color: #BFDBFE; }  /* [수정: 2026-08-21] 초록→파랑, 발송 색과 겹치지 않게 */
  .exp.lg button { font-size: 0.8rem; padding: 6px 13px; }
  details.day-block { border-top: 1px solid #F1F5F9; background: #F1F5F9; }
  details.day-block > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px 8px 30px; font-size: 0.85rem; }
  details.day-block > summary::-webkit-details-marker { display: none; }
  details.day-block > summary::before { content: "▸"; color: #6B7280; font-size: 0.72rem; }
  details.day-block[open] > summary::before { content: "▾"; }
  details.day-block > summary:hover { background: #F3F4F6; }
  .day-block .d { font-weight: 600; color: #1E3A5F; min-width: 96px; font-variant-numeric: tabular-nums; }
  .day-block .dcnt { font-size: 0.78rem; color: #6B7280; }
  .run-row .win { color: #6B7280; font-size: 0.79rem; min-width: 104px; font-variant-numeric: tabular-nums; }
  .run-row .go { color: #2563EB; font-size: 0.78rem; }
  .field { display: flex; align-items: center; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
  .field > label { width: 78px; flex: none; font-size: 0.86rem; color: #6B7280; font-weight: 600; }
  input[type=text], input[type=time], select, textarea {
    font: inherit; font-size: 0.9rem; padding: 7px 11px; border: 1px solid #E5E7EB;
    border-radius: 8px; background: #FFFFFF; color: #1F2937;
  }
  input[type=text] { flex: 1; min-width: 120px; }
  input.hm { flex: none; width: 68px; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; min-width: 0; }
  .now-btn { font: inherit; font-size: 0.8rem; font-weight: 600; padding: 6px 11px; border-radius: 8px; cursor: pointer;
    border: 1px solid #BFDBFE; background: #EFF6FF; color: #2563EB; flex: none; }
  .now-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin: -4px 0 0 88px; }
  .qchip { font-size: 0.78rem; padding: 4px 11px; border-radius: 20px; border: 1px dashed #E5E7EB;
    background: #FFFFFF; color: #4B5563; cursor: pointer; font-family: inherit; }
  .qchip:hover { border-color: #2563EB; color: #2563EB; border-style: solid; }
  /* [수정: 2026-08-25] 시작 시각 -1h/+1h 스테퍼는 만들었다가 도로 뺐다 — 시간 줄에
     테두리 상자가 셋(스테퍼 묶음·종료 입력·칩 줄)으로 늘어 패널이 지저분해졌고,
     0시~지금/최근 1시간/최근 3시간 프리셋이 이미 같은 일을 한 번에 한다. */
  /* [수정: 2026-08-25] '지금' 버튼(종료시각 채우기)은 '다시 불러오기'보다 훨씬
     자주 쓰는 동작이 아니라 입력을 거드는 부속품이라, 링크 톤으로 낮춰 실제
     실행 버튼(다시 불러오기)과 무게를 가른다. */
  .now-link { font: inherit; font-size: 0.8rem; color: #2563EB; background: none; border: none; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; padding: 4px 2px; flex: none; }
  .now-link:disabled { opacity: 0.45; cursor: not-allowed; text-decoration: none; }
  .recollect-action { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border-top: 1px solid #E5E7EB; margin-top: 4px; padding-top: 10px; }
  .recollect-hint { font-size: 0.77rem; color: #9CA3AF; }
  .kw-box { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px solid #E5E7EB; border-radius: 8px; padding: 6px 8px; background: #FFFFFF; min-width: 200px; }
  .kw-chip { background: #EFF6FF; color: #2563EB; border: 1px solid #E5E7EB; border-radius: 14px; padding: 3px 10px; font-size: 0.82rem; display: inline-flex; gap: 6px; align-items: center; }
  .kw-chip button { border: none; background: none; color: #6B7280; cursor: pointer; font-size: 0.9rem; line-height: 1; padding: 0; }
  .kw-add { border: none; background: none; color: #2563EB; cursor: pointer; font-size: 0.82rem; font-weight: 600; padding: 3px 6px; flex: none; }
  .kw-cnt { font-size: 0.76rem; color: #6B7280; margin-left: auto; }
  .tilde { color: #6B7280; }
  .btn { font: inherit; font-size: 0.88rem; padding: 7px 16px; border-radius: 8px; cursor: pointer; border: 1px solid #2563EB; background: #2563EB; color: #FFFFFF; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .btn.ghost { background: #FFFFFF; color: #2563EB; }
  .btn.mute { background: #FFFFFF; color: #6B7280; border-color: #E5E7EB; }
  .btn.danger { background: #FFFFFF; color: #DC2626; border-color: #DC2626; }
  .btn.ai { background: transparent; color: #4A3F8F; border-color: #DCD0F2; }
  .btn.ai:hover { background: #F0EAFB; border-color: #CBB8ED; }
  .btn.sm { font-size: 0.8rem; padding: 5px 11px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .adv { margin-top: 8px; border-top: 1px dashed #E5E7EB; padding-top: 13px; }
  .adv-h { font-size: 0.82rem; color: #6B7280; font-weight: 700; margin-bottom: 10px; }
  .adv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.85rem; }
  .adv-grid label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .warn { background: #FEF2F2; border: 1px solid #FCA5A5; color: #DC2626; border-radius: 9px; padding: 11px 14px; margin: 12px 0; font-size: 0.86rem; }
  .issue-warn { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0 0 88px;
    background: #FFFBEB; border: 1px solid #FDE68A; color: #92400E; border-radius: 8px; padding: 7px 11px; font-size: 0.82rem; }
  .issue-warn.hidden { display: none; }
  .issue-warn button { font: inherit; font-size: 0.78rem; font-weight: 600; padding: 3px 10px; border-radius: 6px; cursor: pointer; }
  .issue-warn .use { background: #B45309; color: #FFFFFF; border: none; }
  .issue-warn .keep { background: #FFFFFF; color: #92400E; border: 1px solid #FDE68A; }
  /* 오늘의 수집 결과 — 사안명 탭. 오늘 만든 카드가 2개 이상일 때만 그려진다. */
  .tabwrap { background: #E3F1EE; margin: -22px -24px 18px; padding: 12px 18px 0; border-radius: 12px 12px 0 0; }
  .tabwrap-h { font-size: 0.74rem; font-weight: 700; color: #146B5E; margin-bottom: 9px; }
  .tabs { display: flex; gap: 4px; align-items: flex-end; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { font-size: 0.8rem; padding: 8px 15px; border-radius: 8px 8px 0 0; background: rgba(255,255,255,0.5);
    color: #146B5E; font-weight: 600; border: 1px solid transparent; border-bottom: none;
    white-space: nowrap; text-decoration: none; position: relative; top: 1px; display: inline-block; }
  .tab:hover { background: rgba(255,255,255,0.8); }
  .tab.on { background: #FFFFFF; font-weight: 700; border-color: #E5E7EB; color: #1E3A5F; padding-bottom: 9px; }
  .tab.on:hover { background: #FFFFFF; }
  .tab .n { color: #6B7280; font-weight: 500; font-size: 0.72rem; margin-left: 5px; }
  /* [수정: 2026-08-25] × 는 그 카드를 삭제한다(탭 갈아타기와 다른 동작이라
     preventDefault+stopPropagation으로 <a>의 이동을 막는다) — 사용자 확인:
     이 화면에 탭 전용의 별도 '치우기' 상태는 필요 없다(삭제만 있으면 된다). */
  .tab .del { margin-left: 7px; color: #6B7280; font-weight: 400; padding: 1px 3px; border-radius: 4px; }
  .tab .del:hover { color: #DC2626; background: rgba(0,0,0,0.06); }
  /* [수정: 2026-08-25] 다른 탭과 헷갈리지 않게 옅은 청록 음영 + 점선 테두리로
     "이동"이 아니라 "만들기"라는 걸 구분한다 — opacity로 흐리기만 하던 예전
     방식은 비활성 탭처럼 보였다(사용자 지적). */
  .tab.add { background: rgba(20,107,94,0.08); color: #146B5E; font-weight: 500;
    border: 1px dashed #146B5E; margin-left: 8px; }
  .tab.add:hover { background: rgba(20,107,94,0.14); }
  .report-head { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; font-size: 1.1rem; font-weight: 700; color: #1E3A5F; }
  .issue-input { font: inherit; font-size: 1.02rem; font-weight: 700; color: #1E3A5F; border: none; border-bottom: 2px dashed #2563EB; background: #EFF6FF; padding: 2px 8px; border-radius: 4px 4px 0 0; width: 180px; }
  .meta-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; font-size: 0.8rem; }
  .chip { background: #F1F5F9; border: 1px solid #E5E7EB; border-radius: 14px; padding: 3px 11px; color: #6B7280; }
  /* ADHOC_DESIGN.md §6.4a — 검색어 편집 패널. 평소엔 접혀 있고, 접힌 상태가 곧 위
     메타 칩 줄이다(새 줄을 만들지 않는다). 펼치면 검색어·꼭 포함할 검색어·시간창이 나온다. */
  .edit-btn { font: inherit; font-size: 0.76rem; padding: 3px 11px; border-radius: 14px; cursor: pointer;
    border: 1px dashed #BFDBFE; background: #FFFFFF; color: #2563EB; font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px; }
  .edit-btn:hover { background: #EFF6FF; border-style: solid; }
  .edit-panel { display: none; border: 1px solid #BFDBFE; background: #FFFFFF;
    border-radius: 10px; padding: 14px 16px 10px; margin-top: 12px; }
  .edit-panel.on { display: block; }
  .edit-panel .field { margin: 0 0 4px; }
  .edit-panel .field > label { width: 104px; line-height: 1.25; }
  .edit-panel .field > label.must-label { color: #146B5E; }
  .kw-box.must { border-color: #146B5E; background: #FFFFFF; }
  .kw-chip.must { background: #E3F1EE; color: #146B5E; border-color: #146B5E; }
  .kw-chip.must button { color: #146B5E; }
  .kw-add.must { color: #146B5E; }
  .kw-addform { display: inline-flex; align-items: center; gap: 2px; flex: 1; min-width: 130px; }
  .kw-addform input { border: none; flex: 1; min-width: 90px; padding: 3px 4px; background: transparent; font-size: 0.85rem; }
  .kw-hint { font-size: 0.75rem; color: #9CA3AF; margin: 0 0 11px 114px; }
  /* 새 수집 화면은 라벨 폭이 78px이라 들여쓰기가 다르다(편집 패널은 104px). */
  .kw-hint.new { margin: -8px 0 0 88px; }
  .chip .must-kw { color: #146B5E; font-weight: 600; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 11px 0; border-top: 1px solid #E5E7EB; border-bottom: 1px solid #E5E7EB; margin: 16px 0; }
  .bulk-bar { display: none; align-items: center; gap: 8px; background: #EFF6FF; border: 1px solid #BFDBFE;
    border-radius: 8px; padding: 8px 12px; margin: -8px 0 16px; font-size: 0.85rem; color: #2563EB; font-weight: 600; }
  h2.sub { color: #1E3A5F; font-size: 1rem; margin: 20px 0 6px; display: flex; align-items: center; gap: 6px; }
  h2.sub .cnt { font-size: 0.76rem; color: #6B7280; font-weight: 400; }
  h2.sub .sub-acts { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .order-btn { background: transparent; border: none; color: #6B7280; font-size: 0.78rem; cursor: pointer;
    padding: 2px 4px; display: inline-flex; }
  .order-btn:disabled { opacity: 0.35; cursor: default; }
  .group-block.sub-custom { border-left: 3px dashed #7DD3FC; padding-left: 10px; margin-left: -13px; }
  .custom-tag { font-size: 0.72rem; color: #0369A1; background: #E0F2FE; border-radius: 10px; padding: 1px 8px; font-weight: 400; }
  .article { padding: 8px 9px; border-radius: 8px; margin: 2px 0; border-bottom: 1px solid #F1F5F9; }
  .article:hover { background: #F3F4F6; }
  .article.out { background: #FFFBEB; border: 1px dashed #FDE68A; }
  .article details { display: block; }
  .article summary { list-style: none; cursor: pointer; }
  .article summary::-webkit-details-marker { display: none; }
  /* [추가: 2026-08-19] 요약 펼침 — app/renderer.py의 "이미 확인한 기사" 규칙과 동일:
     details가 열려있는 동안만 :has()로 제목 색을 바꾼다(자바스크립트 불필요, 닫으면
     자동으로 원래 색으로 돌아온다). */
  .article:has(details[open]) .a-title { opacity: 0.62; }  /* [수정: 2026-08-21] 색 대신 opacity */
  .a-top { display: flex; align-items: flex-start; gap: 8px; }
  .bulk-chk { margin-top: 4px; flex: none; }
  .a-title { font-size: 0.93rem; }
  .a-title .outlet { color: #6B7280; }
  .a-bot { display: flex; align-items: center; gap: 6px; margin: 5px 0 0 25px; }
  .a-time { font-size: 0.78rem; color: #6B7280; }

<script>
var MAX_KEYWORDS = 5;
var keywords = [];

function renderKeywords() {
  document.querySelectorAll('.kw-chip').forEach(function (el) { el.remove(); });
  var box = document.getElementById('kw-box');
  var input = document.getElementById('kw-input');
  keywords.forEach(function (word, idx) {
    var chip = document.createElement('span');
    chip.className = 'kw-chip';
    chip.innerHTML = word.replace(/</g, '&lt;').replace(/>/g, '&gt;') +
      ' <button type="button" onclick="removeKeyword(' + idx + ')">×</button>';
    box.insertBefore(chip, input);
  });
  document.getElementById('kw-cnt').textContent = keywords.length + ' / ' + MAX_KEYWORDS;
  input.disabled = keywords.length >= MAX_KEYWORDS;
  document.getElementById('kw-add-btn').disabled = keywords.length >= MAX_KEYWORDS;

  var hidden = document.getElementById('kw-hidden-inputs');
  hidden.innerHTML = '';
  keywords.forEach(function (word) {
    var h = document.createElement('input');
    h.type = 'hidden'; h.name = 'keywords'; h.value = word;
    hidden.appendChild(h);
  });
}

function addKeyword() {
  var input = document.getElementById('kw-input');
  var word = input.value.trim();
  if (!word || keywords.length >= MAX_KEYWORDS || keywords.indexOf(word) !== -1) return;
  keywords.push(word);
  input.value = '';
  renderKeywords();
}

function removeKeyword(idx) {
  keywords.splice(idx, 1);
  renderKeywords();
}

function onIssueChange() {
  var select = document.getElementById('issue-select');
  var nameInput = document.getElementById('new-issue-name');
  var isNew = select.value === '__new__';
  nameInput.style.display = isNew ? '' : 'none';
  nameInput.required = isNew;
  if (!isNew) {
    var opt = select.options[select.selectedIndex];
    try {
      var last = JSON.parse(opt.dataset.keywords || '[]');
      keywords = last.slice(0, MAX_KEYWORDS);
      renderKeywords();
    } catch (e) {}
  }
}

// [추가: 2026-08-25] 같은 사안을 매번 새 이름으로 타이핑하면(예: "예결위" → "예결위 상정")
// 보관함에서 다른 사안으로 갈라진다 — get_or_create_issue가 이름 완전 일치로만 묶기
// 때문(app/adhoc/card.py). 완전 차단하지 않고 라벨의 "비슷한 라벨 있어요"와 같은 방식으로
// 안내만 한다(막으면 정말 새 사안인 경우를 못 만든다).
var ISSUE_NAMES = ["재경위", "비상대책", "예결위", "테스트3", "9/1 세제개편안", "9/1 국무회의", "9/1 민생대책"];
function issueEditDistance1(a, b) {
  if (a === b) { return true; }
  var la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) { return false; }
  var i = 0, j = 0, edits = 0;
  while (i < la && j < lb) {
    if (a[i] === b[j]) { i++; j++; continue; }
    edits++;
    if (edits > 1) { return false; }
    if (la === lb) { i++; j++; }
    else if (la > lb) { i++; }
    else { j++; }
  }
  return true;
}
function checkSimilarIssue(input) {
  var warn = document.getElementById('issue-sim-warn');
  var typed = input.value.trim();
  if (!typed) { warn.classList.add('hidden'); return; }
  var match = ISSUE_NAMES.find(function (name) {
    if (name === typed) { return false; }
    return issueEditDistance1(name, typed) || name.indexOf(typed) === 0 || typed.indexOf(name) === 0;
  });
  if (!match) { warn.classList.add('hidden'); return; }
  warn.classList.remove('hidden');
  var safe = match.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  var attrSafe = safe.replace(/"/g, '&quot;');
  warn.innerHTML = '비슷한 사안 <b>"' + safe + '"</b>이 있어요.'
    + '<button type="button" class="use" onclick="useSimilarIssue(this)" data-name="' + attrSafe + '">' + safe + ' 선택</button>'
    + '<button type="button" class="keep" onclick="document.getElementById(\'issue-sim-warn\').classList.add(\'hidden\');">새로 만들기</button>';
}
function useSimilarIssue(btn) {
  var name = btn.dataset.name;
  var select = document.getElementById('issue-select');
  var opt = Array.prototype.find.call(select.options, function (o) { return o.textContent === name; });
  if (opt) {
    select.value = opt.value;
    onIssueChange();
  }
  document.getElementById('issue-sim-warn').classList.add('hidden');
}


function padHM(v) {
  v = v.replace(/[^0-9]/g, '').slice(0, 4);
  if (v.length >= 3) return v.slice(0, v.length - 2) + ':' + v.slice(-2);
  return v;
}
function attachHmInput(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('input', function () {
    this.value = padHM(this.value);
    this.setSelectionRange(this.value.length, this.value.length);
  });
}
function nowHM() {
  var d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
// ADHOC_DESIGN.md §6.4a — 검색어 편집 패널 접기/펼치기. 접힌 상태가 기본이고, 접혀
// 있을 때 보이는 메타 칩 줄이 곧 "지금 조건" 요약이다.
function toggleCardEdit() {
  var panel = document.getElementById('edit-panel');
  if (!panel) return;
  panel.classList.toggle('on');
  var btn = document.getElementById('edit-toggle');
  if (btn) btn.querySelector('span').textContent = panel.classList.contains('on') ? '닫기' : '편집';
}

function setNow(id) {
  document.getElementById(id).value = nowHM();
}
function subMinutesClamped(hm, mins) {
  var parts = hm.split(':');
  var total = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10) - mins;
  if (total < 0) total = 0;
  var h = Math.floor(total / 60), m = total % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function setQuick(startId, endId, kind) {
  var now = nowHM();
  document.getElementById(endId).value = now;
  if (kind === 'midnight') document.getElementById(startId).value = '00:00';
  else document.getElementById(startId).value = subMinutesClamped(now, kind === '1h' ? 60 : 180);
}
var HM_RE = /^([01][0-9]|2[0-3]):[0-5][0-9]$/;
function validWindow(startId, endId) {
  var s = document.getElementById(startId).value;
  var e = document.getElementById(endId).value;
  if (!HM_RE.test(s) || !HM_RE.test(e)) {
    alert('시간은 00:00~23:59 형식으로 입력해주세요.');
    return false;
  }
  if (s >= e) {
    alert('끝나는 시각이 시작 시각보다 빠릅니다 (' + s + ' ~ ' + e + ').');
    return false;
  }
  var now = nowHM();
  if (e > now) {
    alert('아직 ' + e + '이 안 됐어요 (지금 ' + now + '). ' + now + '까지만 수집할 수 있어요.');
    return false;
  }
  return true;
}

attachHmInput('win-start');
attachHmInput('win-end');

document.getElementById('new-card-form').addEventListener('submit', function (e) {
  if (keywords.length === 0) {
    e.preventDefault();
    alert('검색어를 하나 이상 입력해주세요.');
    return;
  }
  if (!validWindow('win-start', 'win-end')) {
    e.preventDefault();
  }
});

onIssueChange();
</script>

<script>
var MAX_ALL = 3;   // must_keywords 상한 (app/adhoc/card.py MAX_ADHOC_MUST_KEYWORDS)
var MAX_ANY = 5;   // keywords 상한     (MAX_ADHOC_KEYWORDS)

function currentMode() {
  var el = document.querySelector('input[name=match_mode]:checked');
  return el ? el.value : 'any';
}

function onModeChange() {
  MAX_KEYWORDS = currentMode() === 'all' ? MAX_ALL : MAX_ANY;
  renderKeywords();
}

var _render = renderKeywords;
renderKeywords = function () {
  var mode = currentMode();
  MAX_KEYWORDS = mode === 'all' ? MAX_ALL : MAX_ANY;
  _render();

  var row = document.getElementById('kw-mode');
  var note = document.getElementById('mode-note');
  var radios = row.querySelectorAll('input[type=radio]');
  var opts = row.querySelectorAll('.mode-opt');

  // 검색어가 1개 이하면 두 선택지가 같은 뜻이라 고를 이유가 없다.
  var usable = keywords.length >= 2;
  row.classList.toggle('off', !usable);
  radios.forEach(function (r) { r.disabled = !usable; });

  opts.forEach(function (o, i) {
    o.classList.toggle('on', usable && ((i === 0) === (mode === 'any')));
    o.classList.toggle('all', i === 1);
  });

  var over = mode === 'all' && keywords.length > MAX_ALL;
  note.classList.toggle('is-over', over);
  if (!usable) {
    note.textContent = '검색어를 2개 이상 넣으면 고를 수 있어요';
  } else if (over) {
    note.textContent = '\u2018모두 있는\u2019은 검색어 ' + MAX_ALL + '개까지예요 \u2014 '
      + (keywords.length - MAX_ALL) + '개를 빼주세요';
  } else if (mode === 'all') {
    note.textContent = '예: ' + keywords.slice(0, 2).join(' + ') + ' \u2192 둘 다 들어간 기사만';
  } else {
    note.textContent = '';
  }
  document.querySelector('.btn[type=submit]').disabled = over;
};

// 목업 편의 — 처음 열었을 때 예시 검색어 2개를 미리 넣어둔다.
keywords = ['재정경제부', '국무회의'];
renderKeywords();
</script>
