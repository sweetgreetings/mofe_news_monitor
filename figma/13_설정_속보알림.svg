<text x="495" y="214.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14.7" font-weight="700" fill="#92400E" xml:space="preserve">수시 감시 사용</text>
<text x="495" y="231.9" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#A16207" xml:space="preserve">꺼도 정기 회차 검사는 계속됩니다 (아래 설명 참고)</text>
<text x="919.3" y="221.6" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="10.9" font-weight="700" fill="#FFFFFF" xml:space="preserve">ON</text>
<text x="480" y="295.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14.1" font-weight="700" fill="#1E3A5F" xml:space="preserve">감시 대상 검색어 그룹</text>
<text x="480" y="316.9" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" xml:space="preserve">고른 그룹의 검색 결과에서만 말머리를 찾습니다. 그룹이 많을수록 네이버 호출도 늘어납니다.</text>
<text x="504" y="353.3" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14.4" font-weight="400" fill="#1F2937" xml:space="preserve">재정경제부 관련</text>
<text x="603" y="352.7" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" xml:space="preserve">키워드 6개</text>
<text x="504" y="384.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14.4" font-weight="400" fill="#1F2937" xml:space="preserve">기타</text>
<text x="536.9" y="384.2" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" xml:space="preserve">키워드 2개</text>
<text x="504" y="416.3" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14.4" font-weight="400" fill="#1F2937" xml:space="preserve">현안</text>
<text x="536.9" y="415.7" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" xml:space="preserve">키워드 5개</text>
<text x="504" y="447.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14.4" font-weight="400" fill="#1F2937" xml:space="preserve">추가 검색어</text>
<text x="578.1" y="447.2" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" xml:space="preserve">키워드 6개</text>
<text x="480" y="492.7" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14.1" font-weight="700" fill="#1E3A5F" xml:space="preserve">감시 시간대</text>
<text x="480" y="513.7" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" xml:space="preserve">이 시간에만 확인합니다. 이 밖에는 호출하지 않으므로 알림도 오지 않습니다.</text>
<text x="598.5" y="551.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#6B7280" xml:space="preserve">~</text>
<text x="739.5" y="551.1" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13.6" font-weight="400" fill="#1F2937" xml:space="preserve">확인 주기</text>
<text x="492" y="594.6" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12.8" font-weight="400" fill="#1E3A5F" xml:space="preserve">감시할 그룹을 하나 이상 골라주세요.</text>
<text x="502" y="633.1" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12.8" font-weight="400" fill="#6B7280" xml:space="preserve">감시 시간 밖에 나온 기사는 다음 감시 시작 때 몰아서 받기</text>
<text x="480" y="677.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14.1" font-weight="700" fill="#1E3A5F" xml:space="preserve">받는 사람</text>
<text x="480" y="698.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" xml:space="preserve">말머리별로 누가 받을지는 수신 대상자 화면에서 사람마다 지정합니다.</text>
<text x="493" y="740.7" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13.8" font-weight="400" fill="#1F2937" xml:space="preserve">받는 사람이 없습니다 — 수신 대상자 화면에서 [단독]/[속보]</text>
<text x="493" y="762.7" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13.8" font-weight="400" fill="#1F2937" xml:space="preserve">열을 체크해주세요.</text>
<text x="838" y="751.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13.1" font-weight="400" fill="#FFFFFF" xml:space="preserve">수신 대상자 관리 →</text>
<text x="480" y="825.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="700" fill="#1E3A5F" xml:space="preserve">이 설정을 모두 꺼도</text>
<text x="576.2" y="825.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" xml:space="preserve">정기 회차가 기사를 모을 때 하는 말머리 검사는 그대로
      동작합니다 — 네이버</text>
<text x="480" y="846.4" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" xml:space="preserve">추가 호출이 없는 검사라 항상 켜져 있습니다. 위 수시 감시는
      그보다 빨리 알기 위한 기능입니다.</text>
<text x="720" y="1057" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#FFFFFF" xml:space="preserve">저장</text>
</g>
<g id="h1">
<text x="480" y="119.9" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20.8" font-weight="700" fill="#1E3A5F" xml:space="preserve">🚨 [단독]·[속보] 기사 알림</text>
</g>
<g id="hint">
<text x="480" y="152.4" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13.6" font-weight="400" fill="#6B7280" xml:space="preserve">정기 회차를 기다리지 않고, [단독]·[속보] 말머리가 붙은 기사가 올라오면 바로
    텔레그램으</text>
<text x="480" y="168.4" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13.6" font-weight="400" fill="#6B7280" xml:space="preserve">로 알려줍니다. 정기 모니터링 자동발송(</text>
<text x="689.9" y="168.4" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13.6" font-weight="400" fill="#0000EE" xml:space="preserve">/auto-send</text>
<text x="753.2" y="168.4" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13.6" font-weight="400" fill="#6B7280" xml:space="preserve">)과는
    별개로 동작합니다.</text>
</g>
