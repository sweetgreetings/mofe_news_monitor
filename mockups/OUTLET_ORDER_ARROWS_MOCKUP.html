<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>언론사 순서 버튼 시안</title>
<style>
  /* ── 실제 /outlets 화면 CSS 그대로 (필요한 부분만) ── */
  body { margin: 0; background: #F8FAFC; color: #1F2937; font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
  .container { max-width: 800px; margin: 24px auto; padding: 24px; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 8px; }
  h1 { font-size: 1.3rem; color: #1E3A5F; }
  .hint { color: #6B7280; font-size: 0.85rem; margin-bottom: 16px; }
  button { background: #2563EB; color: #FFFFFF; border: none; border-radius: 4px; padding: 8px 16px; font-size: 1rem;
    font-family: inherit; cursor: pointer; appearance: none; -webkit-appearance: none;
    display: inline-flex; align-items: center; justify-content: center; }
  button:hover { background: #1E3A5F; }
  .ic { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.15em; flex-shrink: 0; }
  .order-list { margin-top: 16px; column-count: 2; column-gap: 32px; }
  .order-list > .hint { column-span: all; }
  .order-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; flex-wrap: wrap; break-inside: avoid; }
  .order-row .order-num { width: 28px; color: #6B7280; }
  .order-row .name { width: 140px; }
  .order-row.just-moved { background: #E7EFE8; border-radius: 4px; }
  @media (max-width: 640px) { .order-list { column-count: 1; } }

  /* 지금 모양 */
  .v-now .order-btn { padding: 2px 10px; font-size: 0.85rem; white-space: nowrap; background: transparent; color: #6B7280; border: 1px solid transparent; }
  .v-now .order-btn:hover { background: #EFF6FF; color: #1E3A5F; }
  .v-now .order-btn.jump { border-color: #BFDBFE; }
  .v-now .order-btn:disabled { background: transparent; color: #E5E7EB; cursor: not-allowed; }
  .v-now .order-btn.jump:disabled { border-color: #E5E7EB; }

  /* ── 새 시안 공통: 박스 없음, SVG 화살표, 누르는 칸은 정사각형에 가깝게 ── */
  .v-new .order-row { gap: 2px; }
  .v-new .order-btn {
    height: 22px; min-width: 26px; padding: 0 5px; gap: 1px;
    background: transparent; color: #4B5563; border: none; border-radius: 6px;
    font-size: 0.8rem; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .v-new .order-btn .ic { width: 17px; height: 17px; stroke-width: 2.2; vertical-align: 0; }
  .v-new .order-btn:hover { background: #EFF6FF; color: #1E3A5F; }
  .v-new .order-btn:disabled { background: transparent; color: #D1D5DB; cursor: not-allowed; }
  /* 한 칸·5칸 사이를 조금 띄워 두 쌍으로 읽히게 */
  .v-new .order-btn.jump-up { margin-right: 4px; }
  .v-new .order-btn.jump-down { margin-left: 4px; }

  /* C안: 5칸은 흐린 색으로 한 단계 낮춘다 */
  .v-c .order-btn.jump-up, .v-c .order-btn.jump-down { color: #9CA3AF; }
  .v-c .order-btn.jump-up:hover, .v-c .order-btn.jump-down:hover { color: #1E3A5F; }

  /* ── 시안 설명 틀 ── */
  .variant { margin-bottom: 32px; }
  .v-label { display: flex; align-items: baseline; gap: 10px; margin: 0 0 4px; }
  .v-label b { color: #1E3A5F; font-size: 1.05rem; }
  .v-label span { color: #6B7280; font-size: 0.85rem; }
  .intro { color: #6B7280; font-size: 0.9rem; margin: 0 0 24px; }
</style>
</head>
<body>
<div class="container" style="max-width: 800px">
  <h1>언론사 순서 버튼 — SVG 화살표 시안</h1>
  <p class="intro">버튼은 실제로 눌러집니다(옮긴 줄은 세이지). 목록은 앞 12개만 보입니다. 마우스를 올리면 뜻이 툴팁으로 나옵니다.</p>
  <div id="variants"></div>
</div>

<script>
var NAMES = ["KBS","SBS","MBC","TV조선","조선일보","동아일보","중앙일보","문화일보","한국일보","서울신문","경향신문","매일경제"];
var STEP = 5;
// app/icons.py 의 up / down 그대로, 5칸용 겹화살표만 새로
var ICON = {
  up: '<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>',
  down: '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
  chev_up: '<path d="m6 15 6-6 6 6"/>',
  chev_down: '<path d="m6 9 6 6 6-6"/>',
  chevs_up: '<path d="m6 12 6-6 6 6"/><path d="m6 18 6-6 6 6"/>',
  chevs_down: '<path d="m6 6 6 6 6-6"/><path d="m6 12 6 6 6-6"/>',
  bar_up: '<path d="M12 20V8"/><path d="m6 14 6-6 6 6"/><path d="M5 4h14"/>',
  bar_down: '<path d="M12 4v12"/><path d="m18 10-6 6-6-6"/><path d="M5 20h14"/>'
};
function svg(n) { return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + ICON[n] + '</svg>'; }

var VARIANTS = [
  { key: "now", cls: "v-now", title: "지금", desc: "글자 화살표 · 5개 버튼에 테두리",
    btn: { jumpup: "5개 ↑", up: "↑", down: "↓", jumpdown: "5개 ↓" } },
  { key: "a", cls: "v-new", title: "A안", desc: "한 칸 = 화살표, 5칸 = 숫자 5 + 화살표 · 박스 없음",
    btn: { jumpup: '5' + svg("up"), up: svg("up"), down: svg("down"), jumpdown: '5' + svg("down") } },
  { key: "b", cls: "v-new", title: "B안", desc: "한 칸 = 꺾쇠 한 겹, 5칸 = 꺾쇠 두 겹 · 숫자 없음(툴팁에만)",
    btn: { jumpup: svg("chevs_up"), up: svg("chev_up"), down: svg("chev_down"), jumpdown: svg("chevs_down") } },
  { key: "c", cls: "v-new v-c", title: "C안", desc: "A안과 같은 모양, 5칸은 한 톤 흐리게(한 칸 이동이 주 동작)",
    btn: { jumpup: '5' + svg("up"), up: svg("up"), down: svg("down"), jumpdown: '5' + svg("down") } }
];
var TITLES = { jumpup: STEP + "개 위로", up: "한 칸 위로", down: "한 칸 아래로", jumpdown: STEP + "개 아래로" };
var CLS = { jumpup: "jump jump-up", up: "", down: "", jumpdown: "jump jump-down" };

function renderList(v, order) {
  var last = order.length - 1;
  var rows = order.map(function (name, i) {
    var b = ["jumpup", "up", "down", "jumpdown"].map(function (d) {
      var dis = (d.indexOf("up") >= 0 && i === 0) || (d.indexOf("down") >= 0 && i === last);
      return '<button type="button" class="order-btn ' + CLS[d] + '" data-v="' + v.key + '" data-i="' + i +
        '" data-d="' + d + '" title="' + TITLES[d] + '" aria-label="' + name + ' ' + TITLES[d] + '"' +
        (dis ? " disabled" : "") + '>' + v.btn[d] + '</button>';
    }).join("");
    return '<div class="order-row" data-name="' + name + '"><span class="order-num">' + (i + 1) +
      '.</span><span class="name">' + name + '</span>' + b + '</div>';
  }).join("");
  return '<p class="hint">선택한 언론사 (43개)</p>' + rows;
}

var state = {};
var host = document.getElementById("variants");
VARIANTS.forEach(function (v) {
  state[v.key] = NAMES.slice();
  var box = document.createElement("div");
  box.className = "variant " + v.cls;
  box.innerHTML = '<div class="v-label"><b>' + v.title + '</b><span>' + v.desc + '</span></div>' +
    '<div class="order-list" id="list-' + v.key + '"></div>';
  host.appendChild(box);
  document.getElementById("list-" + v.key).innerHTML = renderList(v, state[v.key]);
});

host.addEventListener("click", function (e) {
  var btn = e.target.closest(".order-btn");
  if (!btn || btn.disabled) return;
  var v = VARIANTS.filter(function (x) { return x.key === btn.dataset.v; })[0];
  var order = state[v.key], i = +btn.dataset.i, d = btn.dataset.d;
  var step = d.indexOf("jump") === 0 ? STEP : 1;
  var to = d.indexOf("up") >= 0 ? Math.max(0, i - step) : Math.min(order.length - 1, i + step);
  var name = order.splice(i, 1)[0];
  order.splice(to, 0, name);
  var list = document.getElementById("list-" + v.key);
  list.innerHTML = renderList(v, order);
  var row = list.querySelector('[data-name="' + name + '"]');
  row.classList.add("just-moved");
  setTimeout(function () { row.classList.remove("just-moved"); }, 1200);
});
</script>
</body>
</html>
